# Conservative PLA profile for Ender-3 V3 SE and small dimensional parts.
# Intended for the Cherry MX fit coupon and keycaps in this directory.
printer_technology = FFF
gcode_flavor = marlin2
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
filament_diameter = 1.75
layer_height = 0.16
first_layer_height = 0.20
elefant_foot_compensation = 0.20
perimeters = 3
top_solid_layers = 6
bottom_solid_layers = 5
fill_density = 20%
fill_pattern = gyroid
perimeter_generator = arachne
external_perimeter_speed = 25
perimeter_speed = 32
small_perimeter_speed = 22
infill_speed = 45
solid_infill_speed = 35
top_solid_infill_speed = 28
bridge_speed = 25
first_layer_speed = 18
travel_speed = 140
retract_length = 0.8
retract_speed = 40
retract_lift = 0.2
use_relative_e_distances = 1
layer_gcode = G92 E0
temperature = 200
first_layer_temperature = 205
bed_temperature = 60
first_layer_bed_temperature = 60
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
disable_fan_first_layers = 2
skirts = 2
skirt_distance = 3
brim_width = 2
support_material = 0
start_gcode = M220 S100 ; reset speed factor\nM221 S100 ; reset flow factor\nM140 S[first_layer_bed_temperature] ; start bed heating\nM104 S150 ; warm nozzle without oozing\nG90 ; absolute coordinates\nM83 ; relative extrusion\nG28 ; home all axes\nG29 ; probe bed mesh\nM190 S[first_layer_bed_temperature] ; wait for bed\nM109 S[first_layer_temperature] ; wait for nozzle\nG92 E0\nG1 Z2.0 F3000\nG1 X5.1 Y20 Z0.30 F5000\nG1 X5.1 Y200 Z0.30 F1500 E15\nG1 X5.4 Y200 Z0.30 F5000\nG1 X5.4 Y20 Z0.30 F1500 E15\nG92 E0
end_gcode = M400 ; finish buffered moves\nM104 S0 ; nozzle off\nM140 S0 ; bed off\nM107 ; fan off\nG91\nG1 E-1.0 F1800\nG1 Z10 F1800\nG90\nG1 X5 Y210 F5000\nM84 ; motors off
